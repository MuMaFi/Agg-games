<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#5c94fc">
  <title>Mario &ndash; Mini Jump &rsquo;n&rsquo; Run</title>
  <style>
    *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1220;font-family:Arial,sans-serif;touch-action:none;user-select:none}
    body{display:grid;place-items:center}
    #wrap{position:relative;width:min(100vw,1280px);height:min(100vh,720px);aspect-ratio:16/9;overflow:hidden;background:#5c94fc;box-shadow:0 0 50px #0009}
    canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
    #hud{position:absolute;inset:0 0 auto;display:flex;justify-content:space-between;align-items:flex-start;padding:18px 22px;color:#fff;font-weight:900;font-size:clamp(15px,2.2vw,25px);letter-spacing:1px;text-shadow:3px 3px #111;pointer-events:none}
    #help{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-width:min(88%,520px);padding:28px 30px;text-align:center;color:#fff;background:#111d;border:4px solid #fff;border-radius:18px;box-shadow:0 12px 40px #0008}
    #help h1{margin:0 0 10px;color:#ffdf49;font-size:clamp(30px,6vw,58px);text-shadow:4px 4px #b91c1c}
    #help p{margin:8px 0;line-height:1.45}
    #help button{margin-top:15px;border:0;border-radius:12px;padding:13px 28px;font-size:18px;font-weight:900;color:#fff;background:#e52521;box-shadow:0 5px #8d1512;cursor:pointer}
    #help button:active{transform:translateY(3px);box-shadow:0 2px #8d1512}
    #touch{position:absolute;inset:auto 18px 18px;display:none;justify-content:space-between;align-items:end}
    .touch-group{display:flex;gap:12px}.touch-btn{width:66px;height:66px;border-radius:50%;border:3px solid #fff9;background:#1118;color:white;font-size:29px;font-weight:900;display:grid;place-items:center;-webkit-tap-highlight-color:transparent}.touch-btn.on{background:#e52521cc;transform:scale(.94)}
    @media (pointer:coarse),(max-width:800px){#touch{display:flex}#hud{padding:10px 12px}.touch-btn{width:58px;height:58px}}
  </style>
</head>
<body>
<main id="wrap">
  <canvas id="game" width="1280" height="720" aria-label="Mario Jump and Run"></canvas>
  <div id="hud"><span id="score">MARIO 000000</span><span id="coins">&#128176; &times; 00</span><span id="lives">&#9829; &times; 3</span></div>
  <section id="help">
    <h1>SUPER MARIO</h1>
    <p><b>&larr; &rarr;</b> oder <b>A D</b> zum Laufen<br><b>Leertaste / W / &uarr;</b> zum Springen</p>
    <p>Sammle M&uuml;nzen, spring auf Gegner und erreiche die Flagge!</p>
    <button id="start">SPIEL STARTEN</button>
  </section>
  <div id="touch">
    <div class="touch-group"><button class="touch-btn" data-key="left">&#9664;</button><button class="touch-btn" data-key="right">&#9654;</button></div>
    <button class="touch-btn" data-key="jump">&#9650;</button>
  </div>
</main>

  const BAKED = {};
  for(const name in SPR){
    const g = SPR[name], w = g[0].length, h = g.length;
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d');
    for(let y=0;y<h;y++) for(let i=0;i<w;i++){
      const ch = g[y][i];
      if(ch === '.') continue;
      x.fillStyle = PAL[ch]; x.fillRect(i,y,1,1);
    }
    BAKED[name] = c;
  }

  const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
  ctx.imageSmoothingEnabled=false;

  const W=1280,H=720,GROUND=610,LEVEL_W=5900,GRAVITY=.68;
  const keys={left:false,right:false,jump:false};
  let state='menu',camera=0,score=0,coinCount=0,lives=3,last=0,elapsed=0;

  /* Eine Grafik an Weltkoordinaten zeichnen; s ist der Vergrößerungsfaktor. */
  function spr(name,wx,wy,s,flip){
    const c=BAKED[name], w=c.width*s, h=c.height*s;
    const x=Math.round(wx-camera), y=Math.round(wy);
    if(x>W||x+w<0) return;
    if(flip){ ctx.save(); ctx.translate(x+w,y); ctx.scale(-1,1); ctx.drawImage(c,0,0,c.width,c.height,0,0,w,h); ctx.restore(); }
    else ctx.drawImage(c,0,0,c.width,c.height,x,y,w,h);
  }

  const groundPat=ctx.createPattern(groundTile,'repeat');

  function resetWorld(full=true){
    player.x=120;player.y=520;player.vx=0;player.vy=0;player.inv=0;player.face=1;player.run=0;
    camera=0;
    if(full){score=0;coinCount=0;lives=3;elapsed=0;particles=[];popups=[];
      coins=coinStart.map(([x,y])=>({x,y,w:25,h:34,taken:false,phase:Math.random()*7}));
      enemies=enemyStart.map(([x,y,dir])=>({x,y,w:49,h:45,vx:dir*1.25,dead:false,flat:0}));}
    updateHud();
  }
  function updateHud(){scoreEl.textContent='MARIO '+String(score).padStart(6,'0');coinsEl.textContent='\u{1F4B0} × '+String(coinCount).padStart(2,'0');livesEl.textContent='♥ × '+lives;}
  function begin(){resetWorld(true);state='playing';help.style.display='none';}
  startBtn.addEventListener('click',begin);

  const keyMap={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump'};
  addEventListener('keydown',e=>{if(keyMap[e.code]){keys[keyMap[e.code]]=true;e.preventDefault()}if((state==='won'||state==='gameover')&&e.code==='Enter')begin()});
  addEventListener('keyup',e=>{if(keyMap[e.code]){keys[keyMap[e.code]]=false;e.preventDefault()}});
  document.querySelectorAll('.touch-btn').forEach(btn=>{
    const k=btn.dataset.key;
    const down=e=>{e.preventDefault();keys[k]=true;btn.classList.add('on')};
    const up=e=>{e.preventDefault();keys[k]=false;btn.classList.remove('on')};
    btn.addEventListener('pointerdown',down);btn.addEventListener('pointerup',up);btn.addEventListener('pointercancel',up);btn.addEventListener('pointerleave',up);
  });

  function resolveAxis(axis){
    for(const b of blocks){
      if(!overlap(player,b))continue;
      if(axis==='x'){
        if(player.vx>0)player.x=b.x-player.w;else if(player.vx<0)player.x=b.x+b.w;player.vx=0;
      }else{
        if(player.vy>0){player.y=b.y-player.h;player.vy=0;player.onGround=true}
        else if(player.vy<0){player.y=b.y+b.h;player.vy=0;
          if(b.type==='question'){b.type='used';b.bump=12;score+=100;coinCount++;popup(b.x+32,b.y,'+100');updateHud()}
          else if(b.type==='brick'){b.bump=10;burst(b.x+32,b.y+32,'#c84c0c',8,3)}}
      }
    }
  }
  function hurt(){
    if(player.inv>0)return;
    lives--;updateHud();
    if(lives<=0){state='gameover';showEnd('GAME OVER','Dr&uuml;cke Enter oder klicke zum Neustart');return}
    player.x=Math.max(120,camera+90);player.y=430;player.vx=-5;player.vy=-9;player.inv=150;
  }
  function showEnd(title,text){help.querySelector('h1').textContent=title;help.querySelectorAll('p')[0].innerHTML=text;help.querySelectorAll('p')[1].style.display='none';startBtn.textContent='NOCHMAL SPIELEN';help.style.display='block'}
  function popup(x,y,text){popups.push({x,y,text,life:52})}

  function update(dt){
    if(state!=='playing')return;
    elapsed+=dt;if(player.inv>0)player.inv-=dt;
    for(const b of blocks) if(b.bump>0) b.bump-=dt*1.4;
    const accel=player.onGround?.75:.42;
    if(keys.left){player.vx-=accel;player.face=-1}if(keys.right){player.vx+=accel;player.face=1}
    if(!keys.left&&!keys.right)player.vx*=player.onGround?.79:.95;
    player.vx=clamp(player.vx,-7.6,7.6);
    if(keys.jump&&player.onGround){player.vy=-17.2;player.onGround=false;keys.jump=false;burst(player.x+23,player.y+70,'#fff',5,.8)}
    player.vy=Math.min(player.vy+GRAVITY,17);
    player.x+=player.vx;resolveAxis('x');player.onGround=false;player.y+=player.vy;resolveAxis('y');
    player.x=clamp(player.x,0,LEVEL_W-player.w);player.run+=Math.abs(player.vx)*.13;
    if(player.y>H+120){lives--;updateHud();if(lives<=0){state='gameover';showEnd('GAME OVER','Du bist in ein Loch gefallen!')}else{player.x=Math.max(120,camera+40);player.y=280;player.vx=0;player.vy=0}}
    for(const c of coins)if(!c.taken&&overlap(player,c)){c.taken=true;score+=200;coinCount++;burst(c.x+12,c.y+17,'#fcbc3c',10,3);popup(c.x+12,c.y,'+200');updateHud()}
    for(const e of enemies){
      if(e.dead){if(e.flat>0)e.flat-=dt;continue}
      e.x+=e.vx;
      let edge=true;
      for(const b of blocks)if(e.x+e.w/2>b.x&&e.x+e.w/2<b.x+b.w&&Math.abs(e.y+e.h-b.y)<8)edge=false;
      if(edge)e.vx*=-1;
      for(const b of blocks)if(overlap(e,b)){e.x-=e.vx;e.vx*=-1;break}
      if(overlap(player,e)){
        const stomp=player.vy>2&&player.y+player.h-e.y<28;
        if(stomp){e.dead=true;e.flat=48;player.vy=-11.5;score+=300;burst(e.x+24,e.y+20,'#c84c0c',14,4);popup(e.x+24,e.y,'+300');updateHud()}else hurt();
      }
    }
    for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.18*dt;p.life-=dt;p.size*=.985}
    particles=particles.filter(p=>p.life>0);
    for(const p of popups){p.y-=.62*dt;p.life-=dt}
    popups=popups.filter(p=>p.life>0);
    const target=clamp(player.x-W*.36,0,LEVEL_W-W);camera+=(target-camera)*.095;
    if(player.x>5700){state='won';score+=Math.max(0,Math.floor(5000-elapsed*2));updateHud();showEnd('LEVEL GESCHAFFT!','Stark! Dein Punktestand: <b>'+score+'</b>')}
  }

  function burst(x,y,color,count,power){for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,s=Math.random()*power+.5;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:28+Math.random()*20,size:4+Math.random()*7,color})}}

  /* ================= Zeichnen ================= */
  const MARIO_S=4.5, BLOCK_S=4, COIN_S=2.5, GUMBA_S=3.2;

  function drawBlock(b){
    const lift = b.bump>0 ? -Math.sin(b.bump/12*Math.PI)*14 : 0;
    if(b.type==='ground'){
      ctx.save(); ctx.translate(Math.round(-camera),0);
      ctx.fillStyle=groundPat; ctx.fillRect(b.x,b.y,b.w,b.h); ctx.restore(); return;
    }
    if(b.type==='pipe'){
      const s=b.w/32, top=16*s, x=Math.round(b.x-camera);
      const body=BAKED.pipe_body;
      if(b.h>top) ctx.drawImage(body,0,0,32,16,x,Math.round(b.y+top),b.w,Math.ceil(b.h-top));
      ctx.drawImage(BAKED.pipe_top,0,0,32,16,x,Math.round(b.y),b.w,Math.ceil(top));
      return;
    }
    if(b.type==='platform'||b.type==='step'){
      /* Aus Ziegeln zusammengesetzt, damit alles aus demselben Material ist. */
      ctx.save(); ctx.beginPath(); ctx.rect(Math.round(b.x-camera),b.y,b.w,b.h); ctx.clip();
      for(let y=b.y;y<b.y+b.h;y+=BLOCK_S*16)
        for(let x=b.x;x<b.x+b.w;x+=BLOCK_S*16) spr('brick',x,y,BLOCK_S);
      ctx.restore(); return;
    }
    if(b.type==='question'){ const f=['q1','q1','q2','q3','q2'][Math.floor(elapsed*.12)%5]; spr(f,b.x,b.y+lift,BLOCK_S); return; }
    if(b.type==='used'){ spr('used',b.x,b.y+lift,BLOCK_S); return; }
    spr('brick',b.x,b.y+lift,BLOCK_S);
  }
  function drawCoin(c){
    if(c.taken)return;
    const zyklus=['coin1','coin1','coin1','coin2','coin3','coin4','coin2'];
    spr(zyklus[Math.floor(elapsed*.11+c.phase)%7],c.x,c.y,COIN_S);
  }
  function drawEnemy(e){
    const gx=e.x+(e.w-16*GUMBA_S)/2, gy=e.y+e.h-16*GUMBA_S;
    if(e.dead){ if(e.flat>0) spr('gumba_flat',gx,gy,GUMBA_S); return; }
    spr(Math.floor(elapsed*.09)%2 ? 'gumba2':'gumba1', gx,gy,GUMBA_S);
  }
  function drawMario(){
    if(player.inv>0&&Math.floor(player.inv/5)%2)return;
    const w=13*MARIO_S,h=16*MARIO_S;
    let name='m_stand';
    if(!player.onGround) name='m_jump';
    else if(Math.abs(player.vx)>.6){
      const bremst=(keys.left&&player.vx>1.8)||(keys.right&&player.vx<-1.8);
      name = bremst ? 'm_skid' : ['m_walk1','m_walk2','m_walk3'][Math.floor(player.run)%3];
    }
    spr(name, player.x+player.w/2-w/2, player.y+player.h-h, MARIO_S, player.face<0);
  }
  function drawParticles(){for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/40);ctx.fillStyle=p.color;ctx.fillRect(Math.round(p.x-camera),Math.round(p.y),p.size,p.size)}ctx.globalAlpha=1}
  function drawPopups(){
    ctx.textAlign='center'; ctx.font='900 26px Arial';
    for(const p of popups){ ctx.globalAlpha=Math.min(1,p.life/26);
      ctx.fillStyle='#000'; ctx.fillText(p.text,Math.round(p.x-camera)+2,Math.round(p.y)+2);
      ctx.fillStyle='#fff'; ctx.fillText(p.text,Math.round(p.x-camera),Math.round(p.y)); }
    ctx.globalAlpha=1; ctx.textAlign='left';
  }
  function drawFlag(){
    const x=5660;
    ctx.fillStyle='#e8e8e8'; ctx.fillRect(Math.round(x-camera),170,10,440);
    ctx.fillStyle='#00a800'; ctx.beginPath();
    ctx.moveTo(Math.round(x-camera)+10,185); ctx.lineTo(Math.round(x-camera)+128,224); ctx.lineTo(Math.round(x-camera)+10,263); ctx.fill();
    ctx.fillStyle='#fcbc3c'; ctx.fillRect(Math.round(x-camera)-6,156,22,18);
    ctx.fillStyle='#7c2800'; ctx.fillRect(Math.round(x-camera)-30,586,72,24);
  }
  function draw(){
    const sky=ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,'#3c78e8');sky.addColorStop(.6,'#5c94fc');sky.addColorStop(1,'#a8d8ff');
    ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

    /* Hintergrundebenen mit eigener Scrollgeschwindigkeit */
    const kam=camera;
    camera=kam*.12; spr('cloud',300,120,3.5); spr('cloud',1000,210,2.6); spr('cloud',1700,105,3); spr('cloud',2600,175,3.6); spr('cloud',3500,135,2.8); spr('cloud',4400,200,3.2);
    camera=kam*.2;  for(const [hx,hs] of [[430,4.4],[1250,3.2],[2150,5.6],[3500,3.8],[4900,4.6]]) spr('hill',hx,GROUND+2-14*hs,hs);
    camera=kam*.45; for(const [bx,bs] of [[420,3],[1150,2.4],[2100,2.8],[3200,3.2],[4600,2.6]]) spr('bush',bx,GROUND+2-8*bs,bs);
    camera=kam;

    spr('castle',5740,GROUND-160,4);
    drawFlag();
    blocks.forEach(drawBlock);
    coins.forEach(drawCoin);
    enemies.forEach(drawEnemy);
    drawParticles();
    drawMario();
    drawPopups();
    if(state==='menu'){ctx.fillStyle='#0003';ctx.fillRect(0,0,W,H)}
  }
  function loop(t){const dt=Math.min(2.2,(t-last)/16.67||1);last=t;update(dt);draw();requestAnimationFrame(loop)}
  resetWorld(true);requestAnimationFrame(loop);
})();
</script>
