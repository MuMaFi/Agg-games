plugins { id 'com.android.application' }

/* Jeder Bau auf GitHub zählt hoch (-Pfassung=<Laufnummer>), damit ein neues
   APK über das alte installiert werden kann und die Spielstände bleiben. */
def fassung = (project.findProperty('fassung') ?: '1') as int

/* Die Pocketcraft-App trägt dieselbe Fassung wie das Spiel (Jahr.Nummer,
   z. B. 26.9) — sie steht nur an einer Stelle, in menue.js. */
def spielFassung = "1.${fassung}"
def menue = rootProject.file('../games/pocketcraft/menue.js')
if(menue.exists()){
  def m = menue.text =~ /const VERSION = 'Pocketcraft ([0-9.]+)'/
  if(m.find()) spielFassung = m.group(1)
}

android {
  namespace 'de.agg.spiele'
  compileSdk 34

  defaultConfig {
    applicationId 'de.agg.spiele'
    minSdk 26
    targetSdk 34
    versionCode fassung
    versionName "1.${fassung}"
  }

  buildFeatures { buildConfig true }

  /* Zwei Apps aus einer Hülle: alle Spiele mit Übersicht, oder nur
     Pocketcraft mit eigenem Namen und Symbol. Verschiedene Kennungen,
     also können beide nebeneinander installiert sein. Die Spiele legt der
     Workflow je Variante unter src/<variante>/assets ab. */
  flavorDimensions 'app'
  productFlavors {
    alle {
      dimension 'app'
      applicationId 'de.agg.spiele'
      buildConfigField 'String', 'START', '"index.html"'
      buildConfigField 'boolean', 'EINZELN', 'false'
    }
    pocketcraft {
      dimension 'app'
      applicationId 'de.agg.pocketcraft'
      versionName spielFassung
      buildConfigField 'String', 'START', '"games/pocketcraft/index.html"'
      buildConfigField 'boolean', 'EINZELN', 'true'
    }
  }

  /* Ein fester Schlüssel statt des Fehlersuch-Schlüssels, den jeder
     GitHub-Läufer neu würfelt — sonst ließe sich ein neues APK nicht über
     das alte installieren. Er liegt offen im Archiv: gut genug zum
     Selbstinstallieren, nicht für den Play Store. */
  signingConfigs {
    fest {
      storeFile rootProject.file('agg-apps.keystore')
      storePassword 'android'
      keyAlias 'agg'
      keyPassword 'android'
    }
  }

  buildTypes {
    debug { signingConfig signingConfigs.fest }
    release {
      minifyEnabled false
      signingConfig signingConfigs.fest
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  packagingOptions { jniLibs { useLegacyPackaging false } }
  lint { abortOnError false; checkReleaseBuilds false }
}
