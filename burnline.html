<style>
  /* Layout: ein Bildschirm, Vollbild-Canvas; Startpult in der Mitte, Bedienleiste unten, blendet sich aus. */
  :root{
    --ink:#070303;
    --ash:#1a0d0b;
    --ember:#d3241b;
    --ember-hot:#ff6a2a;
    --bone:#efe5d8;
    --smoke:#8d7b73;
    --glass:rgba(10,4,4,.78);
    --line:rgba(239,229,216,.22);
    --f-tape:"VT323", "Courier New", ui-monospace, monospace;
    --f-game:"Press Start 2P", "VT323", ui-monospace, monospace;
    color-scheme:dark;
  }
  [hidden]{display:none!important;}
  html,body{height:100%;}
  body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--f-tape);overflow:hidden;
    -webkit-font-smoothing:antialiased;touch-action:manipulation;}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--ink);}
  button,label.btn{font-family:var(--f-tape);font-size:22px;line-height:1;color:var(--bone);background:transparent;
    border:1px solid var(--line);border-radius:3px;padding:9px 14px;cursor:pointer;letter-spacing:.04em;
    transition:background .15s,border-color .15s,color .15s;}
  button:hover,label.btn:hover{border-color:var(--bone);background:rgba(239,229,216,.06);}
  button:focus-visible,label.btn:focus-within{outline:2px solid var(--ember-hot);outline-offset:2px;}
  button[aria-pressed="true"]{background:var(--ember);border-color:var(--ember);color:#fff;}

  /* Startpult */
  #start{position:fixed;inset:0;display:grid;place-items:center;z-index:5;
    padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
    padding-block:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
    background:radial-gradient(ellipse at center, rgba(7,3,3,.25), rgba(7,3,3,.8));}
  .deck{width:min(560px,100%);display:grid;gap:22px;background:var(--glass);border:1px solid var(--line);
    padding:28px 26px 22px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
  .deck h1{font-family:var(--f-game);font-weight:400;font-size:clamp(22px,6.4vw,38px);margin:0;letter-spacing:.02em;
    color:var(--bone);text-shadow:3px 0 var(--ember),-2px 0 rgba(80,200,255,.35);text-wrap:balance;}
  .deck .tag{margin:-8px 0 0;font-size:22px;color:var(--smoke);letter-spacing:.06em;}
  .src{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .src .btn,.src button{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px;}
  .src small{font-size:17px;color:var(--smoke);letter-spacing:.02em;}
  .src .main{grid-column:1/-1;background:var(--ember);border-color:var(--ember);color:#fff;}
  .src .main small{color:rgba(255,255,255,.75);}
  .src .main:hover{background:#e8352a;}
  .deck .foot{font-size:18px;color:var(--smoke);display:grid;gap:4px;}
  .deck .foot kbd{font-family:var(--f-tape);border:1px solid var(--line);padding:0 5px;border-radius:2px;color:var(--bone);}
  #msg{min-height:1.2em;color:var(--ember-hot);font-size:19px;margin:0;}
  input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;}

  /* Bedienleiste */
  #bar{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;flex-wrap:wrap;align-items:center;gap:8px;
    padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
    padding-block:10px max(12px, env(safe-area-inset-bottom, 0px));
    background:linear-gradient(to top, rgba(7,3,3,.92), rgba(7,3,3,0));transition:opacity .35s, transform .35s;}
  #bar.off{opacity:0;transform:translateY(12px);pointer-events:none;}
  #bar button{font-size:20px;padding:7px 11px;}
  #seekWrap{flex:1 1 180px;min-width:0;display:flex;align-items:center;gap:8px;font-size:20px;color:var(--smoke);}
  #seek{flex:1;min-width:0;accent-color:var(--ember);}
  .chs{display:flex;gap:4px;}
  #tname{font-size:20px;color:var(--smoke);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:28ch;}
  @media (max-width:640px){ #tname{display:none;} .chs button{padding:7px 8px;} }
  #drop{position:fixed;inset:0;z-index:6;display:grid;place-items:center;pointer-events:none;opacity:0;
    font-family:var(--f-game);font-size:clamp(14px,3vw,22px);background:rgba(160,20,15,.35);transition:opacity .2s;}
  #drop.on{opacity:1;}
  body.hidecursor{cursor:none;}

<script>
'use strict';
/* =====================================================================
   BURNLINE — Analog-Trap Visualizer
   WebGL2: Szenen-Pass mit Feedback-Puffer (Ping-Pong, Half-Float) →
   Post-Pass (VHS-Tracking, Chroma, Bloom über Mipmaps, Grain, CRT).
   Audio: eigene Analyse (log-Spektrum, Spectral Flux, Onsets für
   Kick/808, Snare/Clap, Hi-Hats, Hat-Rolls, Drops, BPM, 808-Tonhöhe).
   ===================================================================== */

const $ = s => document.querySelector(s);
const canvas = $('#gl');
const gl = canvas.getContext('webgl2', {antialias:false, alpha:false, depth:false, stencil:false, powerPreference:'high-performance'});
const msg = t => { $('#msg').textContent = t || ''; };
if (!gl) { msg('Dein Browser kann kein WebGL2. Probier Chrome, Edge, Firefox oder Safari 15+.'); throw new Error('no webgl2'); }
const halfOK = !!gl.getExtension('EXT_color_buffer_float');

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let strobeSafe = reduceMotion;

/* ---------------- Szenen ---------------- */
const SCENES = [
  {name:'HAUS',     decay:.84, zoom:.003, rot:.0,  lift:.0022, soft:.34},
  {name:'STEM',     decay:.80, zoom:.002, rot:1.,  lift:0,     soft:.07},
  {name:'GRAT',     decay:.50, zoom:.0,   rot:.0,  lift:0,     soft:.05},
  {name:'PHOSPHOR', decay:.93, zoom:.011, rot:1.,  lift:0,     soft:.04},
  {name:'8-BIT',    decay:.0,  zoom:.0,   rot:.0,  lift:0,     soft:.0 },
];

/* ---------------- Shader ---------------- */
const VS = `#version 300 es
layout(location=0) in vec2 p; out vec2 vUv;
void main(){ vUv = p*.5+.5; gl_Position = vec4(p,0.,1.); }`;

const COMMON = `#version 300 es
precision highp float;
precision highp int;
in vec2 vUv; out vec4 o;
#define PI 3.14159265
float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
float fbm(vec2 p){ float v=0., a=.5; mat2 m=mat2(1.6,1.2,-1.2,1.6);
  for(int i=0;i<5;i++){ v+=a*noise(p); p=m*p; a*=.5; } return v; }
vec3 ember(float t){
  t=clamp(t,0.,1.);
  vec3 c=mix(vec3(0.), vec3(.20,.008,.015), smoothstep(0.,.25,t));
  c=mix(c, vec3(.78,.05,.035), smoothstep(.2,.55,t));
  c=mix(c, vec3(1.,.40,.11), smoothstep(.5,.8,t));
  c=mix(c, vec3(1.,.93,.84), smoothstep(.78,1.,t));
  return c; }
`;

const FS_SCENE = COMMON + `
uniform sampler2D uPrev, uSpec, uWave, uHist;
uniform vec2 uRes;
uniform float uTime, uSub, uBass, uMid, uHigh, uLevel, uKick, uSnare, uHat, uDrop, uRoll, uHue, uHistRow, uSpin, uInt;
uniform float uDecay, uZoom, uRot, uLift;
uniform int uScene;

float spec(float x){ return texture(uSpec, vec2(x,.5)).r; }
float wave(float x){ return texture(uWave, vec2(x,.5)).r*2.-1.; }
float hist(float x, float age){
  float row = mod(uHistRow - floor(age*63.) + 64., 64.);
  return texture(uHist, vec2(x, (row+.5)/64.)).r; }
float fitS(){ return min(1., uRes.x/uRes.y*1.08); }
float sdBox(vec2 p, vec2 b){ vec2 d=abs(p)-b; return length(max(d,0.))+min(max(d.x,d.y),0.); }

/* ---- 1: HAUS — brennendes Haus, rot, verschwommen ---- */
vec3 sceneHaus(vec2 p){
  vec2 q=p/fitS();
  float t=uTime;
  vec2 hp=q-vec2(0.,-.24);
  float body=sdBox(hp,vec2(.16,.10));
  float roof=max(max(abs(hp.x)*.72+hp.y-.235, .10-hp.y), abs(hp.x)-.2);
  float chim=sdBox(hp-vec2(.09,.19),vec2(.022,.06));
  float house=min(min(body,roof),chim);
  float hm=smoothstep(.004,-.004,house);
  float rise=t*(.22+uBass*.3);
  vec2 fq=vec2(q.x*2.4, q.y*2.1-rise*2.);
  float n=fbm(fq+vec2(fbm(fq*1.7+t*.3), fbm(fq*1.3-t*.2))*1.4);
  float heat=n*1.05-(q.y+.02)*1.25-abs(q.x)*1.6-.16+uBass*.26+uKick*.16+uSub*.10;
  float smoke=fbm(q*1.6+vec2(0.,-t*.06))*fbm(q*3.1+vec2(t*.02,-t*.11));
  vec3 col=vec3(.16,.008,.018)*smoke*(.7+uLevel*1.1)+vec3(.05,0.,.004)*(1.-length(q));
  col+=ember(heat)*smoothstep(0.,.25,heat)*.8;
  float win=min(sdBox(hp-vec2(-.08,.02),vec2(.03,.028)), sdBox(hp-vec2(.08,.02),vec2(.03,.028)));
  float door=sdBox(hp-vec2(0.,-.05),vec2(.025,.05));
  float flick=.65+.35*noise(vec2(t*13.,2.));
  vec3 inner=ember(.72+uMid*.25)*smoothstep(.003,-.003,min(win,door))*(.55+uMid*1.6)*flick;
  col=mix(col, vec3(.012,.004,.004)+inner, hm*(1.-clamp(heat-.75,0.,1.)*.6));
  float gy=-.345;
  if(q.y<gy){ float dd=gy-q.y;
    col=mix(col, vec3(.02,0.,.003)+ember(.55)*exp(-abs(q.x)*3.5)*exp(-dd*18.)*(.25+uBass*.6), smoothstep(0.,.006,dd)); }
  col+=vec3(.5,.06,.04)*uSnare*.35*(1.-hm)*smoothstep(-.4,.4,q.y);
  return col; }

/* ---- 2: STEM — Scheibe mit LED-Armen ---- */
vec3 sceneStem(vec2 p){
  vec2 q=p/fitS();
  float r=length(q);
  vec3 col=vec3(.10,0.,.012)*smoothstep(.95,0.,r)*(.35+uLevel*.9);
  col+=vec3(.06,.0,.0)*fbm(q*2.+uTime*.05)*smoothstep(.4,.9,r);
  float body=smoothstep(.405,.40,r);
  col=mix(col, vec3(.036,.031,.029)*(.85+.3*noise(q*55.)), body);
  col+=vec3(.3,.24,.2)*smoothstep(.006,0.,abs(r-.405))*.35;
  float lv[4]; lv[0]=uSub; lv[1]=uBass; lv[2]=uMid; lv[3]=uHigh;
  for(int k=0;k<4;k++){
    float a=uSpin+PI*.25+float(k)*PI*.5;
    vec2 d=vec2(cos(a),sin(a));
    float al=dot(q,d), pe=dot(q,vec2(-d.y,d.x));
    float idx=clamp(floor((al-.085)/.036+.5),0.,7.);
    float cen=.085+idx*.036;
    float dist=length(vec2(al-cen,pe));
    float on=step(idx/8., lv[k]*1.08-.03);
    float led=smoothstep(.0115,.0075,dist);
    float glow=exp(-dist*dist*800.);
    vec3 lc=mix(vec3(.13,.02,.02), vec3(1.,.13,.08), on);
    col+=(lc*led+vec3(1.,.15,.07)*glow*on*.9)*step(0.,al);
  }
  float aa=atan(q.y,q.x)+PI*.5;
  float seg=2.*PI/48.;
  float j=floor(aa/seg);
  float ca=(j+.5)*seg-PI*.5;
  vec2 lp=vec2(cos(ca),sin(ca))*.352;
  float dd=length(q-lp);
  float m=abs((j+.5)/48.*2.-1.);
  float l=spec(.03+.75*(1.-m));
  col+=vec3(1.,.24,.11)*(smoothstep(.0085,.005,dd)*(.08+l*1.5)+exp(-dd*dd*1400.)*l*.8);
  float cr=.048+uKick*.014;
  col+=vec3(1.,.9,.84)*smoothstep(cr,cr-.005,r)*(.25+uKick*1.1);
  col+=vec3(1.,.18,.08)*exp(-r*r*90.)*uSub*.7;
  return col; }

/* ---- 3: GRAT — Spektrum-Gebirge in Pixeln, Sonnenfinsternis ---- */
vec3 sceneGrat(vec2 uv){
  float ps=max(2.,floor(uRes.y/170.));
  vec2 g=(floor(uv*uRes/ps)+.5)*ps;
  vec2 p=(g-.5*uRes)/uRes.y;
  vec3 col=vec3(.07,0.,.01)*smoothstep(-.05,.5,p.y);
  col+=vec3(.35,.03,.03)*exp(-abs(p.y-.1)*9.)*(.25+uBass*.8);
  vec2 sp=p-vec2(0.,.2); float sr=length(sp);
  float cor=exp(-max(sr-.115,0.)*16.)*(.45+uSub*1.2+uKick*.6);
  cor*=.65+.35*noise(vec2(atan(sp.y,sp.x)*5.,uTime*2.));
  col+=ember(.35+cor*.45)*cor;
  col=mix(col, vec3(0.), smoothstep(.118,.112,sr));
  vec2 sid=floor(g/(ps*3.)); float sh=hash(sid);
  if(sh>.986 && p.y>.08) col+=vec3(1.,.86,.8)*(.25+.75*fract(sh*91.+uTime*.7))*(.35+uHat);
  const int N=38;
  for(int i=0;i<N;i++){
    float z=float(i)/float(N);
    float base=mix(-.44,.1,pow(z,.75));
    float sx=p.x/mix(1.,.32,z);
    float f=clamp(abs(sx)*1.05,0.,1.);
    float h=hist(f*.8+.01, z)*mix(.30,.06,z)*(1.-f*.45);
    float top=base+h;
    if(p.y<top){
      float e=step(top-p.y, ps/uRes.y*1.01);
      vec3 lc=ember(.42+h*1.7)*(1.-z*.75);
      col=mix(vec3(.012,0.,.003)*(1.-z), lc, e);
      break;
    }
  }
  return col; }

/* ---- 4: PHOSPHOR — Oszilloskop mit Nachleuchten ---- */
vec3 sceneScope(vec2 p){
  vec2 q=p/fitS();
  float r=length(q), a=atan(q.y,q.x);
  float m=abs(a)/PI;
  float w=wave(m);
  float rr=.21+uBass*.07+w*.11*(.6+uLevel);
  float d=abs(r-rr);
  vec3 col=vec3(1.,.32,.16)*exp(-d*d*26000.)*1.3+vec3(1.,.08,.04)*exp(-d*55.)*.22;
  float s=spec(m*.85+.01);
  float ray=smoothstep(.35,0.,abs(fract(m*72.)-.5))*step(.055,r)*step(r,.07+s*.13);
  col+=ember(.45+s*.55)*ray*.7;
  float aspect=uRes.x/uRes.y;
  float x=p.x/aspect+.5;
  float wy=wave(x)*.11-.37;
  float wd=abs(p.y-wy);
  col+=vec3(1.,.55,.3)*exp(-wd*wd*32000.)*.75;
  col+=vec3(1.,.9,.85)*exp(-r*r*500.)*uKick*.6;
  return col; }

/* ---- 5: 8-BIT — Block-EQ, Sterne, Flammengeist ---- */
const int SPR[8]=int[8](16,56,124,126,219,255,126,60);
vec3 sceneArcade(vec2 uv){
  float vh=120.; float ps=uRes.y/vh;
  vec2 c=floor(uv*uRes/ps);
  float vw=floor(uRes.x/ps);
  vec3 col=vec3(.025,0.,.01);
  float spd=uTime*(18.+uInt*30.);
  float rs=.4+hash(vec2(c.y,1.));
  vec2 sc=vec2(c.x+floor(spd*rs), c.y);
  if(hash(sc*.37+3.)>.994 && c.y>16.) col=vec3(.9,.72,.66)*(.4+rs*.4);
  if(c.y==14.) col=vec3(.55,.06,.05)*(1.+uKick);
  if(c.y<14.){ float ch=mod(floor((c.x+spd*2.)/4.)+floor(c.y/2.),2.); col=mix(vec3(.05,0.,.01),vec3(.11,.01,.02),ch); }
  float nb=24., bw=6.; float x0=floor((vw-nb*bw)*.5);
  float bi=floor((c.x-x0)/bw), bx=mod(c.x-x0,bw);
  if(bi>=0. && bi<nb && bx<5. && c.y>15.){
    float f=(bi+.5)/nb;
    vec4 sv=texture(uSpec, vec2(f*.82+.02,.5));
    float yy=c.y-16.;
    float hgt=floor(sv.r*72./3.)*3.;
    if(yy<hgt && mod(yy,3.)<2.) col=ember(.38+yy/72.*.62);
    float pk=floor(sv.g*72./3.)*3.+1.;
    if(abs(yy-pk)<.5) col=vec3(1.,.9,.82);
  }
  float sz=3.;
  vec2 o0=vec2(floor(vw*.5)-12., 82.+floor(uKick*7.));
  vec2 lc=floor((c-o0)/sz);
  if(lc.x>=0. && lc.x<8. && lc.y>=0. && lc.y<8.){
    int row=7-int(lc.y); int bits=SPR[row];
    int bit=(bits>>(7-int(lc.x)))&1;
    if(bit==1){ col=ember(.95-lc.y*0.0+ (7.-lc.y)*-.06 + .1*noise(vec2(lc.x,uTime*8.))); col=mix(col, vec3(1.,.95,.9), uSnare*.6); }
    else if(row==4) col=mix(vec3(1.,.95,.9), vec3(1.,.1,.05), uSnare);
  }
  return col; }

/* ---- Pixel-Glut, in allen Szenen ---- */
vec3 embers(vec2 uv){
  vec3 c=vec3(0.);
  for(int l=0;l<3;l++){
    float fl=float(l);
    float ps=(3.+fl*2.)*max(1.,uRes.y/700.);
    vec2 g=uv*uRes/(ps*7.);
    g.y-=uTime*(.6+fl*.35)*(1.+uInt*.8);
    g.x+=sin(g.y*.31+fl*2.)*.6;
    vec2 id=floor(g), f=fract(g);
    float h=hash(id+fl*17.31);
    if(h>.935-uInt*.04-uSnare*.06){
      vec2 c0=vec2(hash(id+3.1),hash(id+7.7))*.6+.2;
      vec2 d=abs(f-c0);
      float sq=step(max(d.x,d.y), .5/7.);
      c+=ember(.55+h*.45)*sq*(.35+uHigh*.9+uSnare*.5);
    }
  }
  return c; }

void main(){
  vec2 uv=vUv;
  float aspect=uRes.x/uRes.y;
  vec2 p=(uv*uRes-.5*uRes)/uRes.y;
  vec2 c=uv-.5; c.x*=aspect;
  float zoom=1.-(uZoom*(1.+uKick*2.5)+uDrop*.05);
  float ang=uRot*(.002+(uHue-.5)*.006+uSnare*.012);
  float cs=cos(ang), sn=sin(ang);
  c=mat2(cs,-sn,sn,cs)*c*zoom;
  c+=(vec2(noise(c*4.+uTime),noise(c*4.-uTime))-.5)*.003*uInt;
  c.x/=aspect;
  vec2 puv=c+.5; puv.y-=uLift*(1.+uBass);
  vec3 prev=textureLod(uPrev,puv,0.).rgb;
  float dec=max(uDecay, uDrop*.92);
  prev=max(prev*dec-.003,0.);
  vec3 cur;
  if(uScene==0) cur=sceneHaus(p);
  else if(uScene==1) cur=sceneStem(p);
  else if(uScene==2) cur=sceneGrat(uv);
  else if(uScene==3) cur=sceneScope(p);
  else cur=sceneArcade(uv);
  cur+=embers(uv);
  o=vec4(max(cur,prev),1.);
}`;

const FS_POST = COMMON + `
uniform sampler2D uScene, uHud;
uniform vec2 uRes;
uniform float uTime, uKick, uGlitch, uPixel, uSoft, uRoll, uFlash, uLevel, uSnare;
vec2 barrel(vec2 uv, float k){ vec2 c=uv-.5; return .5+c*(1.+k*dot(c,c)); }
void main(){
  vec2 uv=barrel(vUv,.09);

function analyze(t,dt){

    for(let i=0;i<NB;i++){

    if(pi>0 && pk>.62 && S.sub>.35){
      const a=mag[pi-1], b=mag[pi], c=mag[pi+1]; const den=a-2*b+c; const off=den!==0? .5*(a-c)/den : 0;
      const hz=(pi+off)*binHz; const midi=69+12*Math.log2(hz/440);

const PI2=Math.PI*2, specIn=new Float32Array(NB);
function estimateBPM(){

  if(onTimes.length<8) return;
  let best=0,bestS=0;
  for(let bpm=70;bpm<=180;bpm++){
    const per=60/bpm; let sc=0;
    for(let i=0;i<onTimes.length;i++) for(let j=i+1;j<onTimes.length;j++){
      const d=onTimes[j][0]-onTimes[i][0]; if(d>2.6) break;
      const k=d/per, r=Math.round(k*2)/2, e=k-r; if(r>=.5) sc+=onTimes[i][1]*onTimes[j][1]*Math.exp(-e*e*80)/Math.max(1,r); }

    if(sc>bestS){bestS=sc;best=bpm;} }
  if(best) S.bpm = S.bpm && Math.abs(S.bpm-best)<6 ? Math.round(lerp(S.bpm,best,.3)) : best;

function satCurve(k){ const n=2048, c=new Float32Array(n); const d=Math.tanh(k); for(let i=0;i<n;i++){ const x=i/(n-1)*2-1; c[i]=Math.tanh(k*x)/d; } return c; }

/* ---------------- Render-Loop ---------------- */
let last=performance.now(), fpsAcc=0, fpsN=0, slowT=0;
function frame(nowMs){

  gl.useProgram(PS.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,rd.t);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,specTex);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D,waveTex);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D,histTex);
  i1(PS,'uPrev',0); i1(PS,'uSpec',1); i1(PS,'uWave',2); i1(PS,'uHist',3);
  gl.uniform2f(PS.u.uRes,sw,sh);
  const gm=strobeSafe?.35:1;
  f1(PS,'uTime',now%3600); f1(PS,'uSub',S.sub); f1(PS,'uBass',S.bass); f1(PS,'uMid',S.mid); f1(PS,'uHigh',S.high); f1(PS,'uLevel',S.level);
  f1(PS,'uKick',S.kick*gm+S.kick*(1-gm)*.4); f1(PS,'uSnare',S.snare*gm); f1(PS,'uHat',S.hat); f1(PS,'uDrop',S.drop); f1(PS,'uRoll',S.roll);
  f1(PS,'uHue',S.hue); f1(PS,'uHistRow',histIdx); f1(PS,'uSpin',S.spin); f1(PS,'uInt',Math.min(1.2,S.int));
  f1(PS,'uDecay',sc.decay); f1(PS,'uZoom',sc.zoom); f1(PS,'uRot',sc.rot); f1(PS,'uLift',sc.lift); i1(PS,'uScene',scene);
  gl.drawArrays(gl.TRIANGLES,0,3);
  gl.bindTexture(gl.TEXTURE_2D,null);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,wr.t); gl.generateMipmap(gl.TEXTURE_2D);
  // Post-Pass
  gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,canvas.width,canvas.height);
  gl.useProgram(PP.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,wr.t);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,hudTex);
  i1(PP,'uScene',0); i1(PP,'uHud',1);
  gl.uniform2f(PP.u.uRes,canvas.width,canvas.height);
  f1(PP,'uTime',now%3600); f1(PP,'uKick',S.kick*gm); f1(PP,'uGlitch',S.glitch*gm); f1(PP,'uPixel',S.pixel); f1(PP,'uSoft',sc.soft);
  f1(PP,'uRoll',S.roll*gm); f1(PP,'uFlash',S.flash*(strobeSafe?.25:1)); f1(PP,'uLevel',S.level); f1(PP,'uSnare',S.snare);
  gl.drawArrays(gl.TRIANGLES,0,3);
  ping=1-ping;

  // UI
  if(srcMode==='file' && audioEl.duration){ seek.value=audioEl.currentTime/audioEl.duration*1000; $('#tcur').textContent=fmt(audioEl.currentTime); $('#tdur').textContent=fmt(audioEl.duration); }
  if(srcMode!=='none' && nowMs-barT>3000 && !$('#bar').classList.contains('off')){ $('#bar').classList.add('off'); document.body.classList.add('hidecursor'); }
  updPlayBtn();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__burnline={S,setScene,triggerDrop,startDemo};
</script>
